<!DOCTYPE html>
<html>
<head>
<style>

.container {

    display: grid;

    grid-template-columns: 1fr 2fr;

    gap: 10px;

}

.box {

    background-color: lightblue;

    padding: 20px;

}

</style>
</head>

<body>

<div class="container">

    <div class="box">1</div>

    <div class="box">2</div>

</div>

</body>
</html>
