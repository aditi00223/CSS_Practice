<!DOCTYPE html>
<html>
<head>
    <title>Subscript and Superscript with CSS</title>

    <style>
        sub {
            color: blue;
            font-size: 20px;
        }

        sup {
            color: red;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h2>Subscript Example</h2>

    <p>Water Formula: H<sub>2</sub>O</p>

    <p>Carbon Dioxide: CO<sub>2</sub></p>

    <h2>Superscript Example</h2>

    <p>x<sup>2</sup> + y<sup>2</sup></p>

    <p>10<sup>3</sup> = 1000</p>

</body>
</html>
