<!DOCTYPE html>
<html>
<head>
<style>

.card {

    width: 250px;

    padding: 20px;

    border-radius: 10px;

    background-color: lightblue;

    color: darkblue;

    box-shadow: 2px 2px 10px gray;

    transition: 0.5s;

}

.card:hover {

    background-color: blue;

    color: white;

    transform: scale(1.05);

    box-shadow: 10px 10px 20px gray;

}

</style>
</head>

<body>

<div class="card">

    <h2>Aditi Sharma</h2>

    <p>Learning CSS</p>

</div>

</body>
</html>
