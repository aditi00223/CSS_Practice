<!DOCTYPE html>
<html>
<head>
<style>

.container {

    display: grid;

    grid-template-columns:
    repeat(auto-fit, minmax(200px, 1fr));

    gap: 15px;

}

.card {

    background-color: lightblue;

    padding: 20px;

    border-radius: 10px;

}

</style>
</head>

<body>

<div class="container">

    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
    <div class="card">Card 4</div>

</div>

</body>
</html>
